[workspace]
resolver = "2"
members = [
  "crates/veyra-core",
  "crates/veyra-policy",
  "crates/veyra-journal",
  "crates/veyra-executor",
  "crates/veyra-protocol",
  "crates/veyra-server",
  "crates/veyra-cli",
  "apps/desktop/src-tauri",
  "examples/custom-adapter",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/tang-vu/veyra"
authors = ["Veyra contributors"]
readme = "README.md"
keywords = ["ai-agents", "capabilities", "audit", "security", "recovery"]
categories = ["development-tools"]

[workspace.dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
bytes = "1.11.1"
cap-fs-ext = "4.0.3"
cap-std = "4.0.2"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
futures-util = "0.3.34"
hmac = "0.13.0"
http = "1.4.0"
proptest = "1.11.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "chrono"] }
schemars = { version = "1.2.2", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "limit", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.25.0", features = ["v4", "serde"] }
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
