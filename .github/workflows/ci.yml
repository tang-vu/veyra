name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-linux:
    name: Full gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          rustup default 1.96.0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test Rust
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Build public Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Verify generated schemas
        run: |
          cargo run --locked -p veyra-protocol --example generate-schema -- packages/protocol-schema/schema
          node packages/protocol-schema/scripts/verify-generated.mjs
          git diff --exit-code -- packages/protocol-schema/schema

      - name: Verify TypeScript and frontend
        run: |
          pnpm oss:check
          pnpm format
          pnpm check
          pnpm lint
          pnpm test
          pnpm build
          pnpm package:check

      - name: Run security and recovery evals
        env:
          VEYRA_RUST_TOOLCHAIN: 1.96.0
        run: pnpm eval

      - name: Install Playwright Chromium
        run: pnpm --filter @veyra/desktop exec playwright install chromium

      - name: Exercise the real desktop transaction flow
        shell: bash
        run: |
          set -euo pipefail
          demo_root="$RUNNER_TEMP/veyra-e2e"
          cargo run --locked -p veyra-server -- --data-directory "$demo_root/data" --workspace "$demo_root/workspace" >"$RUNNER_TEMP/veyra-server.log" 2>&1 &
          server_pid=$!
          pnpm --filter @veyra/desktop dev --host 127.0.0.1 >"$RUNNER_TEMP/veyra-vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$server_pid" "$vite_pid" 2>/dev/null || true' EXIT
          for _ in {1..60}; do
            [[ -s "$demo_root/data/api-token" ]] && curl --silent --fail http://127.0.0.1:1420/ >/dev/null && break
            sleep 1
          done
          [[ -s "$demo_root/data/api-token" ]]
          curl --silent --fail -H "Authorization: Bearer $(<"$demo_root/data/api-token")" http://127.0.0.1:7843/v1/health >/dev/null
          VEYRA_E2E_TOKEN_FILE="$demo_root/data/api-token" pnpm --filter @veyra/desktop test:e2e

  rust-windows:
    name: Rust gate (Windows MSVC)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0-x86_64-pc-windows-msvc --profile minimal --component clippy,rustfmt
          rustup default 1.96.0-x86_64-pc-windows-msvc

      - name: Lint and test workspace
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked
