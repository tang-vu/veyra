name: Release artifacts

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated vX.Y.Z tag to recover from protected main; leave empty for a build-only dry run
        required: false
        type: string

env:
  VEYRA_RELEASE_REF: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  VEYRA_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  VEYRA_PUBLISH_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}

permissions:
  contents: read

jobs:
  release-contract:
    name: Validate release contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate manual recovery context
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "release recovery must be dispatched from protected main" >&2
            exit 1
          }
          [[ "$VEYRA_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release_tag must be an existing vX.Y.Z tag" >&2
            exit 1
          }

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VEYRA_RELEASE_REF }}
          persist-credentials: false

      - name: Check out protected release-control revision
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-control
          persist-credentials: false

      - name: Install pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Match tag, manifests, changelog, and release notes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            node scripts/check-release.mjs "$VEYRA_RELEASE_TAG" --require-tag
          elif [[ "$VEYRA_PUBLISH_RELEASE" == "true" ]]; then
            VEYRA_RELEASE_SOURCE="$GITHUB_WORKSPACE" \
              node .release-control/scripts/check-release.mjs "$VEYRA_RELEASE_TAG" --require-tag --allow-recovery
          else
            node scripts/check-release.mjs
          fi

  core-binaries:
    name: Core binaries (${{ matrix.name }})
    needs: release-contract
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VEYRA_RELEASE_REF }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Build CLI and daemon
        run: cargo build --locked --release -p veyra-cli -p veyra-server

      - name: Package Linux binaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package="veyra-${{ matrix.name }}"
          mkdir -p "dist/$package"
          cp target/release/veyra target/release/veyra-server LICENSE README.md "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          rm -r "dist/$package"
          (cd dist && sha256sum "$package.tar.gz" > "$package.tar.gz.sha256")
          echo "VEYRA_RELEASE_ARTIFACT=dist/$package.tar.gz" >> "$GITHUB_ENV"

      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "veyra-${{ matrix.name }}"
          $stage = Join-Path dist $package
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath target/release/veyra.exe,target/release/veyra-server.exe,LICENSE,README.md -Destination $stage
          Compress-Archive -LiteralPath $stage -DestinationPath "dist/$package.zip"
          Remove-Item -LiteralPath $stage -Recurse
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist/$package.zip").Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content -Encoding ascii "dist/$package.zip.sha256"
          "VEYRA_RELEASE_ARTIFACT=dist/$package.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke-test packaged Linux binaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/veyra-release-smoke"
          mkdir -p "$smoke_root"
          tar -xzf "$VEYRA_RELEASE_ARTIFACT" -C "$smoke_root"
          package_root="$smoke_root/veyra-${{ matrix.name }}"
          "$package_root/veyra" --version
          "$package_root/veyra-server" --help >/dev/null
          "$package_root/veyra" demo --json

      - name: Smoke-test packaged Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "veyra-release-smoke"
          Expand-Archive -LiteralPath $env:VEYRA_RELEASE_ARTIFACT -DestinationPath $smokeRoot
          $packageRoot = Join-Path $smokeRoot "veyra-${{ matrix.name }}"
          & (Join-Path $packageRoot "veyra.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "packaged CLI version probe failed" }
          & (Join-Path $packageRoot "veyra-server.exe") --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "packaged daemon help probe failed" }
          & (Join-Path $packageRoot "veyra.exe") demo --json
          if ($LASTEXITCODE -ne 0) { throw "packaged reversible demo failed" }

      - name: Attest core archive
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.VEYRA_RELEASE_ARTIFACT }}

      - name: Upload core artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veyra-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  desktop-windows:
    name: Unsigned Windows desktop bundle
    needs: release-contract
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VEYRA_RELEASE_REF }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0-x86_64-pc-windows-msvc --profile minimal
          rustup default 1.96.0-x86_64-pc-windows-msvc

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS bundle
        run: pnpm desktop:build

      - name: Collect bundle and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $installer = Get-ChildItem -LiteralPath target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "Tauri did not produce an NSIS installer" }
          Copy-Item -LiteralPath $installer.FullName -Destination dist/
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path dist $installer.Name)).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii (Join-Path dist "$($installer.Name).sha256")

      - name: Attest desktop installer
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.exe

      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veyra-desktop-windows-x86_64-unsigned
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release-sbom:
    name: Release dependency SBOM
    needs: release-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VEYRA_RELEASE_REF }}
          persist-credentials: false

      - name: Check out protected SBOM configuration
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-control
          persist-credentials: false

      - name: Prepare SBOM output
        shell: bash
        run: mkdir -p dist

      - name: Generate SPDX dependency snapshot with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        env:
          SYFT_SOURCE_NAME: veyra
          SYFT_SOURCE_VERSION: ${{ env.VEYRA_RELEASE_TAG }}
        with:
          path: .
          format: spdx-json
          output-file: dist/veyra-${{ env.VEYRA_RELEASE_TAG }}.spdx.json
          syft-version: v1.42.3
          config: ${{ inputs.release_tag != '' && '.release-control/.syft.yaml' || '.syft.yaml' }}
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Validate and checksum SPDX dependency snapshot
        shell: bash
        run: |
          set -euo pipefail
          sbom_name="veyra-$VEYRA_RELEASE_TAG.spdx.json"
          jq -e '
            .spdxVersion == "SPDX-2.3" and
            (.packages | length > 0) and
            ([.packages[].externalRefs[]?.referenceLocator] | any(startswith("pkg:cargo/"))) and
            ([.packages[].externalRefs[]?.referenceLocator] | any(startswith("pkg:npm/")))
          ' "dist/$sbom_name" >/dev/null
          (cd dist && sha256sum "$sbom_name" > "$sbom_name.sha256")

      - name: Attest release SBOM
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.spdx.json

      - name: Upload release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veyra-release-sbom
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs:
      - release-contract
      - core-binaries
      - desktop-windows
      - release-sbom
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VEYRA_RELEASE_REF }}
          persist-credentials: false

      - name: Check out protected release-control revision
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-control
          persist-credentials: false

      - name: Install pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: veyra-*
          path: dist
          merge-multiple: true

      - name: Add release documentation and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          notes_path="docs/releases/$VEYRA_RELEASE_TAG.md"
          if [[ -d .release-control ]]; then
            notes_path=".release-control/$notes_path"
          fi
          test -s "$notes_path"
          cp LICENSE README.md CHANGELOG.md dist/
          cp "$notes_path" dist/RELEASE_NOTES.md
          cd dist
          shopt -s nullglob
          checksums=(*.sha256)
          (( ${#checksums[@]} > 0 ))
          sed -i 's/\r$//' -- "${checksums[@]}"
          for checksum in "${checksums[@]}"; do
            sha256sum --check "$checksum"
          done

      - name: Create release manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest_script="scripts/create-release-manifest.mjs"
          if [[ -d .release-control ]]; then
            manifest_script=".release-control/$manifest_script"
          fi
          VEYRA_RELEASE_SOURCE="$GITHUB_WORKSPACE" \
            node "$manifest_script" "$VEYRA_RELEASE_TAG" dist

      - name: Attest release manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.release-manifest.json

      - name: Create immutable-ready GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VEYRA_RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $VEYRA_RELEASE_TAG already exists; publish a new patch version instead" >&2
            exit 1
          fi
          release_notes="$(cat dist/RELEASE_NOTES.md)"
          gh release create "$VEYRA_RELEASE_TAG" dist/* --draft --verify-tag --fail-on-no-commits --generate-notes --notes "$release_notes" --title "Veyra $VEYRA_RELEASE_TAG"
          gh release edit "$VEYRA_RELEASE_TAG" --draft=false
