name: Release artifacts

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-binaries:
    name: Core binaries (${{ matrix.name }})
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Build CLI and daemon
        run: cargo build --locked --release -p veyra-cli -p veyra-server

      - name: Package Linux binaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package="veyra-${{ matrix.name }}"
          mkdir -p "dist/$package"
          cp target/release/veyra target/release/veyra-server LICENSE README.md "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          rm -r "dist/$package"
          (cd dist && sha256sum "$package.tar.gz" > "$package.tar.gz.sha256")
          echo "VEYRA_RELEASE_ARTIFACT=dist/$package.tar.gz" >> "$GITHUB_ENV"

      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "veyra-${{ matrix.name }}"
          $stage = Join-Path dist $package
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath target/release/veyra.exe,target/release/veyra-server.exe,LICENSE,README.md -Destination $stage
          Compress-Archive -LiteralPath $stage -DestinationPath "dist/$package.zip"
          Remove-Item -LiteralPath $stage -Recurse
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist/$package.zip").Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content -Encoding ascii "dist/$package.zip.sha256"
          "VEYRA_RELEASE_ARTIFACT=dist/$package.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attest core archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.VEYRA_RELEASE_ARTIFACT }}

      - name: Upload core artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veyra-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  desktop-windows:
    name: Unsigned Windows desktop bundle
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0-x86_64-pc-windows-msvc --profile minimal
          rustup default 1.96.0-x86_64-pc-windows-msvc

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS bundle
        run: pnpm desktop:build

      - name: Collect bundle and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $installer = Get-ChildItem -LiteralPath target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "Tauri did not produce an NSIS installer" }
          Copy-Item -LiteralPath $installer.FullName -Destination dist/
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path dist $installer.Name)).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii (Join-Path dist "$($installer.Name).sha256")

      - name: Attest desktop installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.exe

      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veyra-desktop-windows-x86_64-unsigned
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - core-binaries
      - desktop-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: veyra-*
          path: dist
          merge-multiple: true

      - name: Add release documentation and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE README.md dist/
          cd dist
          shopt -s nullglob
          checksums=(*.sha256)
          (( ${#checksums[@]} > 0 ))
          sed -i 's/\r$//' -- "${checksums[@]}"
          for checksum in "${checksums[@]}"; do
            sha256sum --check "$checksum"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; publish a new patch version instead" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Veyra $GITHUB_REF_NAME"
